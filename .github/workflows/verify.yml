name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.21.0 --activate
      - run: node test/path-infer.test.mjs
      - run: node test/placement.test.mjs
      - run: pnpm --dir demo install --frozen-lockfile
      - run: pnpm --dir demo build
