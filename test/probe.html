<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>React fiber 源码信息探测</title>
    <style>
      body { font: 13px/1.6 ui-monospace, monospace; padding: 16px; }
      pre { background: #f4f4f4; padding: 12px; overflow: auto; }
      h2 { font-size: 14px; }
    </style>
  </head>
  <body>
    <h2 id="ver">loading…</h2>
    <div id="root"></div>
    <pre id="out">探测中…</pre>

    <script type="module">
      // 用 ?v=18 / ?v=19 切换 React 版本。React 19 不再发 UMD build，所以走 ESM CDN。
      const v = new URLSearchParams(location.search).get('v') || '19';

      const [{ jsxDEV }, ReactDOM, React] = await Promise.all([
        import(`https://esm.sh/react@${v}/jsx-dev-runtime?dev`),
        import(`https://esm.sh/react-dom@${v}/client?dev&deps=react@${v}`),
        import(`https://esm.sh/react@${v}?dev`),
      ]);

      document.getElementById('ver').textContent = `React ${React.version}`;

      // 手写 jsxDEV 调用，第 5 个参数就是 babel-plugin-transform-react-jsx-source 会注入的 source 对象。
      // 这样绕过整条构建链，直接验证 React runtime 本身是否把它存到 fiber 上。
      const src = (line, column) => ({ fileName: '/src/Card.jsx', lineNumber: line, columnNumber: column });

      function Card({ label }) {
        return jsxDEV(
          'section',
          {
            className: 'card',
            children: jsxDEV('button', { id: 'probe-btn', children: label }, undefined, false, src(4, 7), this),
          },
          undefined,
          false,
          src(3, 5),
          this,
        );
      }

      function App() {
        return jsxDEV(
          'div',
          { children: jsxDEV(Card, { label: '点我' }, undefined, false, src(7, 7), this) },
          undefined,
          false,
          src(6, 5),
          this,
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(
        jsxDEV(App, {}, undefined, false, src(1, 1), undefined),
      );

      // ---- 探测 ----
      setTimeout(() => {
        const dom = document.querySelector('#probe-btn');
        const out = document.getElementById('out');
        if (!dom) return void (out.textContent = '✗ 没渲染出来');

        let fiberKey = null;
        for (const k in dom) {
          if (k.startsWith('__reactFiber$') || k.startsWith('__reactInternalInstance$')) fiberKey = k;
        }
        if (!fiberKey) return void (out.textContent = '✗ DOM 节点上找不到 fiber');

        const typeName = (t) =>
          !t ? null : typeof t === 'string' ? t : typeof t === 'function' ? t.name || '(anon)' : 'obj';

        const chain = [];
        let f = dom[fiberKey];
        while (f && chain.length < 12) {
          chain.push({
            name: typeName(f.type),
            debugFields: Object.keys(f).filter((k) => k.startsWith('_debug')),
            _debugSource: f._debugSource
              ? `${f._debugSource.fileName}:${f._debugSource.lineNumber}:${f._debugSource.columnNumber}`
              : null,
            _debugStack: f._debugStack
              ? String(f._debugStack.stack || f._debugStack).split('\n').slice(0, 4)
              : null,
            _debugOwner: f._debugOwner ? typeName(f._debugOwner.type) : null,
            _debugInfo: f._debugInfo ?? null,
          });
          f = f.return;
        }

        const hit = chain.find((n) => n._debugSource);
        out.textContent =
          `React 版本: ${React.version}\n` +
          `fiber key: ${fiberKey}\n` +
          `结论: ${hit ? '✓ _debugSource 可用 → ' + hit._debugSource : '✗ _debugSource 全链路缺失'}\n\n` +
          JSON.stringify(chain, null, 2);
      }, 300);
    </script>
  </body>
</html>
